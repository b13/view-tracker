name: publish

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish new version to TER
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The annotated tag message becomes the TER upload comment.
          fetch-depth: 0

      - name: Check tag
        id: get-version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Tag $version is no version number, nothing to publish."
            exit 1
          fi
          declared=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["extra"]["typo3/cms"]["version"] ?? "";')
          if [[ "$declared" != "$version" ]]; then
            echo "Tag $version does not match the version $declared in composer.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get comment
        id: get-comment
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          comment=$(git tag -n10 -l "$VERSION" | sed "s/^[0-9.]*[ ]*//g")
          if [[ -z "${comment// }" ]]; then
            comment="Released version $VERSION"
          fi
          {
            echo "comment<<EOF"
            echo "$comment"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: intl, mbstring, json, zip, curl

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          COMMENT: ${{ steps.get-comment.outputs.comment }}
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment "$COMMENT" "$VERSION"
